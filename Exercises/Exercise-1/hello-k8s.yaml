apiVersion: v1
kind: Namespace
metadata:
  name: exercise1
---
apiVersion: v1
kind: Pod
metadata:
  name: hello-k8s
  namespace: exercise1
  labels:
    run: hello-k8s
spec:
  containers:
    - name: hello-k8s
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s
  namespace: exercise1
spec:
  type: NodePort
  selector:
    run: hello-k8s
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
