services:
  mongodb:
    image: mongo:7.0
    container_name: treasurebook-mongodb
    restart: unless-stopped
    volumes:
      - treasurebook-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    container_name: treasurebook-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/treasurebook
    ports:
      - "5002:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  treasurebook-data:
